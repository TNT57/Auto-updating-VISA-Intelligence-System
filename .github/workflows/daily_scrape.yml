name: Daily Scrape

on:
  schedule:
    # Run daily at 2 AM AEST (UTC+10) = 4 PM UTC previous day
    - cron: '0 16 * * *'
  workflow_dispatch: # Allow manual trigger

# Needed so the cache can be written back after the run.
permissions:
  contents: read

concurrency:
  # Two overlapping runs would race on the snapshot state.
  group: daily-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # ------------------------------------------------------------------
      # Change detection is only possible if state survives between runs.
      # The runner is ephemeral and database/ is gitignored, so without this
      # every run would start from an empty DB, re-baseline, and report zero
      # changes forever. changes.db holds both the page snapshots and the
      # PDF ingestion hashes, so it is the only state that must persist.
      # ------------------------------------------------------------------
      - name: Restore pipeline state
        uses: actions/cache@v4
        with:
          path: |
            database/changes.db
            data/raw/pdfs
          key: visa-state-${{ github.run_id }}
          restore-keys: |
            visa-state-

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: .cache/huggingface
          key: hf-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            hf-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily update
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scripts/daily_update.py

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-logs-${{ github.run_id }}
          path: logs/
          retention-days: 14
          if-no-files-found: ignore
