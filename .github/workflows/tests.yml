name: Tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Run unit tests
        run: pytest tests/ -v

      # Slow: downloads the embedding model and builds a real ChromaDB
      # collection. Deselected from the run above by the `-m 'not integration'`
      # default in pyproject.toml.
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: .cache/huggingface
          key: hf-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            hf-

      - name: Run integration tests
        run: pytest tests/ -v -m integration
